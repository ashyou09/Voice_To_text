<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxScribe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230f766e%22/%3E%3Cpath d=%22M6 10v4M9 7v10M12 5v14M15 8v8M18 10v4%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e6e8ec; --text: #1c2026; --muted: #6b7280;
    --accent: #0f766e; --accent-soft: #e6f4f2; --accent-ink: #0b5952;
    --danger: #b42318; --warn: #b54708; --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 var(--font); color: var(--text); background: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 4px 8px 16px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  .nav:hover { background: var(--bg); color: var(--text); }
  .nav.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .aside-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px 10px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #c4c8cf; }
  .dot.on { background: #12b76a; }

  main { padding: 28px 36px 60px; max-width: 1240px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }

  /* new transcription */
  .tabs { display: flex; gap: 4px; padding: 10px 10px 0; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 14px; border: none; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .pane { padding: 20px; }
  .drop { border: 1.5px dashed #c9cdd4; border-radius: 10px; padding: 34px; text-align: center; cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 15px; margin: 8px 0 2px; }
  .drop small { color: var(--muted); }
  .chosen { margin-top: 10px; color: var(--accent-ink); font-weight: 600; }
  .rec { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px; }
  .recbtn { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fde2e0; background: #e5484d; cursor: pointer; }
  .recbtn.on { border-radius: 14px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(229,72,77,.15); } }
  .timer { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
  input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .url { width: 100%; padding: 11px 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding: 16px 20px; border-top: 1px solid var(--line); background: #fbfbfc; border-radius: 0 0 var(--radius) var(--radius); }
  .opt label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding-bottom: 8px; }
  .opts .spacer { flex: 1; }

  /* file list */
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 10px; }
  .section-title h2 { font-size: 16px; margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafbfc; }
  .fname { font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .ficon { width: 30px; height: 30px; border-radius: 7px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #eef0f3; color: #3c4350; font-weight: 500; }
  .pill.done { background: #e7f6ee; color: #067647; }
  .pill.error { background: #fdecea; color: var(--danger); }
  .pill.busy { background: #fff4e5; color: var(--warn); }
  .bar { height: 4px; background: #eef0f3; border-radius: 4px; margin-top: 6px; overflow: hidden; width: 140px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .empty { text-align: center; color: var(--muted); padding: 36px; }

  /* editor */
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .title-input { font-size: 20px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; background: transparent; min-width: 240px; flex: 1; }
  .title-input:hover, .title-input:focus { border-color: var(--line); background: #fff; outline: none; }
  .saved { font-size: 12px; color: var(--muted); }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(16,24,40,.12); padding: 8px; width: 230px; z-index: 20; display: none; }
  .menu-pop.open { display: block; }
  .menu-pop button { width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  .menu-pop button:hover { background: var(--bg); }
  .menu-pop .chk { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
  .ext { color: var(--muted); font-size: 12px; }

  .editor { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .doc { padding: 8px 28px 28px; min-height: 60vh; }
  .findbar { display: flex; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; position: sticky; top: 0; background: #fff; z-index: 5; flex-wrap: wrap; }
  .findbar input[type=text] { flex: 1; min-width: 120px; }
  .para { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 10px 0; }
  .meta-col { padding-top: 2px; }
  .spk { display: inline-block; font-weight: 600; font-size: 13px; color: var(--accent-ink); cursor: pointer; border-radius: 6px; padding: 0 4px; margin-left: -4px; }
  .spk:hover { background: var(--accent-soft); }
  .spk.none { color: #a0a6b0; font-weight: 500; }
  .ts { display: block; font-size: 12px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
  .ts:hover { color: var(--accent); }
  .ptext { font-size: 15.5px; line-height: 1.75; }
  .seg { border-radius: 4px; padding: 1px 0; outline: none; transition: background .15s; }
  .seg:hover { background: #f2f4f7; }
  .seg:focus { background: #fff8db; }
  .seg.active { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
  mark { background: #ffe58a; border-radius: 2px; }

  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .player { padding: 12px; }
  video { width: 100%; border-radius: 8px; background: #000; max-height: 220px; display: block; }
  video.audio-only { height: 54px; background: #f1f3f4; }
  .player-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .side .card > div.inner { padding: 16px; }
  .ai-btns { display: flex; flex-direction: column; gap: 8px; }
  .ai-btns .btn { justify-content: flex-start; }
  .ai-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .summary { font-size: 14px; }
  .summary h1, .summary h2, .summary h3 { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 12px 0 4px; }
  .summary ul { padding-left: 18px; margin: 4px 0; }
  .summary p { margin: 6px 0; }
  .details { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; }

  .progress-card { padding: 40px; text-align: center; }
  .bigbar { height: 8px; background: #eef0f3; border-radius: 8px; overflow: hidden; max-width: 420px; margin: 18px auto 8px; }
  .bigbar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c2026; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; max-width: 80vw; }
  .toast.show { opacity: 1; }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; } aside { display: none; }
    .editor { grid-template-columns: 1fr; } .side { position: static; order: -1; }
    main { padding: 20px; } .para { grid-template-columns: 1fr; gap: 2px; }
  }

  .notice { padding: 14px 18px; margin-bottom: 16px; border-color: #fedf89; background: #fffaeb; color: #93370d; }
  .login { max-width: 380px; margin: 12vh auto; padding: 28px; }
  code { font-size: 12.5px; background: #f1f3f5; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
      VoxScribe
    </div>
    <a class="nav" id="nav-new" href="#/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> New transcription</a>
    <a class="nav" id="nav-files" href="#/files">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> My files</a>
    <div class="aside-foot">
      <div id="engine-status"><span class="dot"></span>Connecting…</div>
      <div id="ai-status"><span class="dot"></span>AI tools off</div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
