<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxScribe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230f766e%22/%3E%3Cpath d=%22M6 10v4M9 7v10M12 5v14M15 8v8M18 10v4%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e6e8ec; --text: #1c2026; --muted: #6b7280;
    --accent: #0f766e; --accent-soft: #e6f4f2; --accent-ink: #0b5952;
    --danger: #b42318; --warn: #b54708; --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 var(--font); color: var(--text); background: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 4px 8px 16px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  .nav:hover { background: var(--bg); color: var(--text); }
  .nav.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .aside-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px 10px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #c4c8cf; }
  .dot.on { background: #12b76a; }

  main { padding: 28px 36px 60px; max-width: 1240px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }

  /* new transcription */
  .tabs { display: flex; gap: 4px; padding: 10px 10px 0; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 14px; border: none; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .pane { padding: 20px; }
  .drop { border: 1.5px dashed #c9cdd4; border-radius: 10px; padding: 34px; text-align: center; cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 15px; margin: 8px 0 2px; }
  .drop small { color: var(--muted); }
  .chosen { margin-top: 10px; color: var(--accent-ink); font-weight: 600; }
  .rec { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px; }
  .recbtn { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fde2e0; background: #e5484d; cursor: pointer; }
  .recbtn.on { border-radius: 14px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(229,72,77,.15); } }
  .timer { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
  input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .url { width: 100%; padding: 11px 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding: 16px 20px; border-top: 1px solid var(--line); background: #fbfbfc; border-radius: 0 0 var(--radius) var(--radius); }
  .opt label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding-bottom: 8px; }
  .opts .spacer { flex: 1; }

  /* file list */
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 10px; }
  .section-title h2 { font-size: 16px; margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafbfc; }
  .fname { font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .ficon { width: 30px; height: 30px; border-radius: 7px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #eef0f3; color: #3c4350; font-weight: 500; }
  .pill.done { background: #e7f6ee; color: #067647; }
  .pill.error { background: #fdecea; color: var(--danger); }
  .pill.busy { background: #fff4e5; color: var(--warn); }
  .bar { height: 4px; background: #eef0f3; border-radius: 4px; margin-top: 6px; overflow: hidden; width: 140px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .empty { text-align: center; color: var(--muted); padding: 36px; }

  /* editor */
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .title-input { font-size: 20px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; background: transparent; min-width: 240px; flex: 1; }
  .title-input:hover, .title-input:focus { border-color: var(--line); background: #fff; outline: none; }
  .saved { font-size: 12px; color: var(--muted); }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(16,24,40,.12); padding: 8px; width: 230px; z-index: 20; display: none; }
  .menu-pop.open { display: block; }
  .menu-pop button { width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
  .menu-pop button:hover { background: var(--bg); }
  .menu-pop .chk { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
  .ext { color: var(--muted); font-size: 12px; }

  .editor { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .doc { padding: 8px 28px 28px; min-height: 60vh; }
  .findbar { display: flex; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; position: sticky; top: 0; background: #fff; z-index: 5; flex-wrap: wrap; }
  .findbar input[type=text] { flex: 1; min-width: 120px; }
  .para { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 10px 0; }
  .meta-col { padding-top: 2px; }
  .spk { display: inline-block; font-weight: 600; font-size: 13px; color: var(--accent-ink); cursor: pointer; border-radius: 6px; padding: 0 4px; margin-left: -4px; }
  .spk:hover { background: var(--accent-soft); }
  .spk.none { color: #a0a6b0; font-weight: 500; }
  .ts { display: block; font-size: 12px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
  .ts:hover { color: var(--accent); }
  .ptext { font-size: 15.5px; line-height: 1.75; }
  .seg { border-radius: 4px; padding: 1px 0; outline: none; transition: background .15s; }
  .seg:hover { background: #f2f4f7; }
  .seg:focus { background: #fff8db; }
  .seg.active { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
  mark { background: #ffe58a; border-radius: 2px; }

  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .player { padding: 12px; }
  video { width: 100%; border-radius: 8px; background: #000; max-height: 220px; display: block; }
  video.audio-only { height: 54px; background: #f1f3f4; }
  .player-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .side .card > div.inner { padding: 16px; }
  .ai-btns { display: flex; flex-direction: column; gap: 8px; }
  .ai-btns .btn { justify-content: flex-start; }
  .ai-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .summary { font-size: 14px; }
  .summary h1, .summary h2, .summary h3 { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 12px 0 4px; }
  .summary ul { padding-left: 18px; margin: 4px 0; }
  .summary p { margin: 6px 0; }
  .details { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; }

  .progress-card { padding: 40px; text-align: center; }
  .bigbar { height: 8px; background: #eef0f3; border-radius: 8px; overflow: hidden; max-width: 420px; margin: 18px auto 8px; }
  .bigbar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c2026; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; max-width: 80vw; }
  .toast.show { opacity: 1; }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; } aside { display: none; }
    .editor { grid-template-columns: 1fr; } .side { position: static; order: -1; }
    main { padding: 20px; } .para { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
      VoxScribe
    </div>
    <a class="nav" id="nav-new" href="#/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> New transcription</a>
    <a class="nav" id="nav-files" href="#/files">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> My files</a>
    <div class="aside-foot">
      <div><span class="dot on"></span>Whisper · local</div>
      <div id="ai-status"><span class="dot"></span>AI tools off</div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = sec => { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const ago = t => { const d = (Date.now() / 1000 - t); if (d < 60) return "just now"; if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " h ago"; return new Date(t * 1000).toLocaleDateString(); };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); }
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

const LANGS = [["", "Auto-detect"], ["en", "English"], ["hi", "Hindi"], ["ur", "Urdu"], ["bn", "Bengali"], ["mr", "Marathi"], ["gu", "Gujarati"],
  ["pa", "Punjabi"], ["ta", "Tamil"], ["te", "Telugu"], ["kn", "Kannada"], ["ml", "Malayalam"], ["es", "Spanish"], ["fr", "French"],
  ["de", "German"], ["ar", "Arabic"], ["ja", "Japanese"], ["zh", "Chinese"]];
const LANG_NAME = Object.fromEntries(LANGS);
const MODEL_LABEL = { tiny: "Fastest (tiny)", base: "Fast (base)", small: "Balanced (small)", medium: "Accurate (medium)",
  "large-v3": "Most accurate (large-v3)", turbo: "Accurate + fast (turbo)" };
let CONFIG = { models: ["small"], ai_enabled: false };
let pollTimer = null;

// ---------------- router ----------------
async function route() {
  clearTimeout(pollTimer);
  if (dirty) flushSave();
  const h = location.hash || "#/";
  document.querySelectorAll(".nav").forEach(n => n.classList.remove("active"));
  if (h.startsWith("#/t/")) return renderEditor(h.slice(4));
  if (h === "#/files") { $("#nav-files").classList.add("active"); return renderHome(true); }
  $("#nav-new").classList.add("active"); renderHome(false);
}
window.addEventListener("hashchange", route);

// ---------------- home: new transcription + files ----------------
let chosenFile = null, recorder = null, recChunks = [], recBlob = null, recTimer = null, mode = "upload";

function renderHome(filesOnly) {
  chosenFile = null; recBlob = null;
  $("#view").innerHTML = `
    ${filesOnly ? `<h1>My files</h1><p class="sub">All your transcripts, stored locally in the <code>data/</code> folder.</p>` : `
    <h1>New transcription</h1>
    <p class="sub">Turn audio or video into an editable transcript. Export as Markdown, PDF, TXT or subtitles.</p>
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-mode="upload">Upload file</button>
        <button class="tab" data-mode="record">Record audio</button>
        <button class="tab" data-mode="link">From a link</button>
      </div>
      <div class="pane" id="pane"></div>
      <div class="opts">
        <div class="opt"><label>Spoken language</label>
          <select id="lang">${LANGS.map(([v, n]) => `<option value="${v}">${n}</option>`).join("")}</select></div>
        <div class="opt"><label>Accuracy</label>
          <select id="model">${CONFIG.models.map(m => `<option value="${m}" ${m === "small" ? "selected" : ""}>${MODEL_LABEL[m] || m}</option>`).join("")}</select></div>
        <label class="toggle"><input type="checkbox" id="translate"> Translate to English</label>
        <div class="spacer"></div>
        <button class="btn primary" id="start">Transcribe
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>`}
    <div class="section-title"><h2>${filesOnly ? "" : "Recent files"}</h2></div>
    <div class="card" id="files"><div class="empty">Loading…</div></div>`;

  if (!filesOnly) {
    document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
      mode = t.dataset.mode; renderPane();
    });
    mode = "upload"; renderPane();
    $("#lang").onchange = e => { if (e.target.value === "hi" && $("#model").value === "small") toast("Tip: 'Accurate (medium)' or 'turbo' gives much better Hindi."); };
    $("#start").onclick = start;
  }
  loadFiles();
}

function renderPane() {
  const p = $("#pane");
  if (mode === "upload") {
    p.innerHTML = `<div class="drop" id="drop">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <strong>Drop a file here or click to browse</strong>
        <small>MP3, WAV, M4A, OGG, FLAC, MP4, MOV, MKV, WEBM</small>
        <div class="chosen" id="chosen">${chosenFile ? esc(chosenFile.name) : ""}</div>
      </div><input type="file" id="fileinput" hidden accept="audio/*,video/*">`;
    const drop = $("#drop"), inp = $("#fileinput");
    drop.onclick = () => inp.click();
    inp.onchange = () => { chosenFile = inp.files[0]; $("#chosen").textContent = chosenFile?.name || ""; };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); chosenFile = e.dataTransfer.files[0]; $("#chosen").textContent = chosenFile?.name || ""; };
  } else if (mode === "record") {
    p.innerHTML = `<div class="rec">
        <button class="recbtn" id="recbtn" title="Start / stop recording"></button>
        <div class="timer" id="rectime">0:00</div>
        <div class="sub" id="rechint" style="margin:0">${recBlob ? "Recording ready. Press Transcribe." : "Click to start recording from your microphone"}</div>
        <audio id="recplay" controls ${recBlob ? "" : "hidden"}></audio>
      </div>`;
    if (recBlob) $("#recplay").src = URL.createObjectURL(recBlob);
    $("#recbtn").onclick = toggleRecord;
  } else {
    p.innerHTML = `<input type="text" class="url" id="url" placeholder="Paste a YouTube or other video link — https://…">
      <p class="sub" style="margin:8px 0 0;font-size:13px">Only use links to media you have the right to download.</p>`;
  }
}

async function toggleRecord() {
  const btn = $("#recbtn");
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => e.data.size && recChunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(recTimer);
      recBlob = new Blob(recChunks, { type: recorder.mimeType || "audio/webm" });
      btn.classList.remove("on"); $("#rechint").textContent = "Recording ready. Press Transcribe.";
      const a = $("#recplay"); a.hidden = false; a.src = URL.createObjectURL(recBlob);
    };
    recorder.start(); btn.classList.add("on"); $("#rechint").textContent = "Recording… click to stop";
    const t0 = Date.now(); recTimer = setInterval(() => $("#rectime").textContent = fmt((Date.now() - t0) / 1000), 250);
  } catch (e) { toast("Microphone not available: " + e.message); }
}

async function start() {
  const fd = new FormData();
  if (mode === "upload") { if (!chosenFile) return toast("Choose a file first"); fd.append("file", chosenFile); }
  else if (mode === "record") {
    if (!recBlob) return toast("Record something first");
    const ext = (recBlob.type.includes("mp4") ? ".m4a" : recBlob.type.includes("ogg") ? ".ogg" : ".webm");
    fd.append("file", recBlob, `Recording ${new Date().toLocaleString().replace(/[/:]/g, "-")}${ext}`);
  } else { const u = $("#url").value.trim(); if (!u) return toast("Paste a link first"); fd.append("url", u); }
  fd.append("language", $("#lang").value); fd.append("model", $("#model").value);
  fd.append("translate", $("#translate").checked);
  const btn = $("#start"); btn.disabled = true; btn.textContent = "Uploading…";
  try { const m = await api("/api/transcriptions", { method: "POST", body: fd }); location.hash = "#/t/" + m.id; }
  catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "Transcribe"; }
}

const STATUS = { queued: "Queued", downloading: "Downloading", transcribing: "Transcribing", done: "Ready", error: "Failed" };
async function loadFiles() {
  const box = $("#files"); if (!box) return;
  let items; try { items = await api("/api/transcriptions"); } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!items.length) { box.innerHTML = `<div class="empty">No transcripts yet. Upload your first file above.</div>`; return; }
  box.innerHTML = `<table><thead><tr><th>Name</th><th>Status</th><th>Language</th><th>Duration</th><th>Created</th><th></th></tr></thead><tbody>
    ${items.map(m => {
      const busy = !["done", "error"].includes(m.status);
      return `<tr data-id="${m.id}">
        <td><div class="fname"><span class="ficon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>${esc(m.title)}</div></td>
        <td><span class="pill ${m.status === "done" ? "done" : m.status === "error" ? "error" : "busy"}">${STATUS[m.status] || m.status}${m.status === "transcribing" ? " " + Math.round(m.progress * 100) + "%" : ""}</span>
          ${busy ? `<div class="bar"><i style="width:${Math.round(m.progress * 100)}%"></i></div>` : ""}</td>
        <td>${esc(LANG_NAME[m.language] || m.language || "—")}${m.translate ? " → English" : ""}</td>
        <td>${m.duration ? fmt(m.duration) : "—"}</td>
        <td>${ago(m.created)}</td>
        <td style="text-align:right"><button class="btn ghost sm del" title="Delete">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></td></tr>`;
    }).join("")}</tbody></table>`;
  box.querySelectorAll("tbody tr").forEach(tr => tr.onclick = e => {
    if (e.target.closest(".del")) {
      if (confirm("Delete this transcript and its media?")) api("/api/transcriptions/" + tr.dataset.id, { method: "DELETE" }).then(loadFiles);
      return;
    }
    location.hash = "#/t/" + tr.dataset.id;
  });
  if (items.some(m => !["done", "error"].includes(m.status))) { clearTimeout(pollTimer); pollTimer = setTimeout(loadFiles, 2000); }
}

// ---------------- editor ----------------
let T = null, dirty = false, saveTimer = null;

async function renderEditor(id) {
  let m; try { m = await api("/api/transcriptions/" + id); } catch (e) { $("#view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  T = m;
  if (m.status !== "done") return renderProgress(m);
  $("#view").innerHTML = `
    <div class="topbar">
      <a class="btn ghost sm" href="#/files">← Files</a>
      <input class="title-input" id="title" value="${esc(m.title)}">
      <span class="saved" id="saved">All changes saved</span>
      <div class="menu"><button class="btn primary" id="expbtn">Export
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="menu-pop" id="exppop">
          <button data-fmt="md">Markdown <span class="ext">.md</span></button>
          <button data-fmt="pdf">PDF <span class="ext">.pdf</span></button>
          <button data-fmt="txt">Plain text <span class="ext">.txt</span></button>
          <button data-fmt="srt">Subtitles <span class="ext">.srt</span></button>
          <hr>
          <label class="chk"><input type="checkbox" id="exp-ts" checked> Include timestamps</label>
          <label class="chk"><input type="checkbox" id="exp-sum" checked> Include AI summary</label>
        </div></div>
    </div>
    <div class="editor">
      <div class="card doc">
        <div class="findbar">
          <input type="text" id="find" placeholder="Find…">
          <input type="text" id="repl" placeholder="Replace with…">
          <button class="btn sm" id="replall">Replace all</button>
          <label class="toggle" style="padding:0;font-size:13px;color:var(--muted)"><input type="checkbox" id="follow" checked> Follow playback</label>
        </div>
        <div id="doc"></div>
      </div>
      <div class="side">
        <div class="card player">
          <video id="media" controls preload="metadata" src="/api/transcriptions/${m.id}/media"></video>
          <div class="player-row"><span>Click any sentence to jump there</span>
            <select id="speed" style="padding:3px 6px">${[0.75, 1, 1.25, 1.5, 2].map(s => `<option ${s === 1 ? "selected" : ""} value="${s}">${s}×</option>`).join("")}</select></div>
        </div>
        <div class="card"><div class="inner">
          <h3>AI tools</h3>
          <div class="ai-btns">
            <button class="btn" data-ai="summary">✦ Summarize</button>
            <button class="btn" data-ai="cleanup">✎ Fix punctuation &amp; spelling</button>
            <button class="btn" data-ai="speakers">☺ Detect speakers</button>
          </div>
          <div class="ai-note" id="ai-note">${CONFIG.ai_enabled ? "Using " + esc(CONFIG.ai_model) + "." : "Set AI_BASE_URL and AI_API_KEY in your .env file to turn these on."}</div>
        </div></div>
        <div class="card" id="sumcard" ${m.summary ? "" : "hidden"}><div class="inner"><h3>Summary</h3><div class="summary" id="summary"></div></div></div>
        <div class="card"><div class="inner"><h3>Details</h3>
          <dl class="details">
            <dt>Language</dt><dd>${esc(LANG_NAME[m.language] || m.language)} ${m.language_probability ? `(${Math.round(m.language_probability * 100)}%)` : ""}${m.translate ? " → English" : ""}</dd>
            <dt>Duration</dt><dd>${fmt(m.duration)}</dd>
            <dt>Model</dt><dd>${esc(MODEL_LABEL[m.model] || m.model)}</dd>
            <dt>Words</dt><dd id="wc"></dd>
          </dl></div></div>
      </div>
    </div>`;

  renderDoc(); renderSummary();
  const media = $("#media");
  media.addEventListener("loadedmetadata", () => { if (!media.videoWidth) media.classList.add("audio-only"); });
  media.addEventListener("timeupdate", highlight);
  $("#speed").onchange = e => media.playbackRate = +e.target.value;
  $("#title").onchange = e => { T.title = e.target.value.trim() || T.title; queueSave(); };
  $("#expbtn").onclick = e => { e.stopPropagation(); $("#exppop").classList.toggle("open"); };
  document.addEventListener("click", e => { if (!e.target.closest(".menu")) $("#exppop")?.classList.remove("open"); });
  $("#exppop").querySelectorAll("button[data-fmt]").forEach(b => b.onclick = async () => {
    await flushSave();
    location.href = `/api/transcriptions/${T.id}/export?fmt=${b.dataset.fmt}&timestamps=${$("#exp-ts").checked}&summary=${$("#exp-sum").checked}`;
  });
  $("#find").oninput = renderDoc;
  $("#replall").onclick = replaceAll;
  document.querySelectorAll("[data-ai]").forEach(b => { b.disabled = !CONFIG.ai_enabled; b.onclick = () => runAI(b); });
}

function renderProgress(m) {
  const pct = Math.round((m.progress || 0) * 100);
  $("#view").innerHTML = `<div class="topbar"><a class="btn ghost sm" href="#/files">← Files</a></div>
    <div class="card progress-card">
      ${m.status === "error" ? `<h2 style="margin:0 0 6px">Transcription failed</h2><p class="sub" style="margin:0">${esc(m.error)}</p>` : `
      <div class="spinner"></div>
      <h2 style="margin:16px 0 4px">${esc(m.title)}</h2>
      <p class="sub" style="margin:0">${{ queued: "Waiting for the previous file to finish…", downloading: "Downloading media from the link…",
        transcribing: pct ? "Transcribing…" : "Loading the speech model… (the first run downloads it, this can take a few minutes)" }[m.status] || ""}</p>
      <div class="bigbar"><i style="width:${pct}%"></i></div><div class="sub" style="margin:0">${pct}%</div>`}
    </div>`;
  if (m.status !== "error") pollTimer = setTimeout(() => renderEditor(m.id), 1500);
}

function paragraphs(segs) {
  const out = [];
  segs.forEach((s, i) => {
    const last = out[out.length - 1];
    if (!last || s.start - segs[i - 1].end > 2 || last.length >= 6 || (s.speaker || "") !== (segs[i - 1].speaker || "")) out.push([i]);
    else last.push(i);
  });
  return out;
}

function highlightText(text, q) {
  if (!q) return esc(text);
  const parts = text.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"));
  return parts.map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("");
}

function renderDoc() {
  const q = $("#find")?.value || "";
  const segs = T.segments;
  $("#doc").innerHTML = segs.length ? paragraphs(segs).map(idx => {
    const first = segs[idx[0]];
    return `<div class="para">
      <div class="meta-col">
        <span class="spk ${first.speaker ? "" : "none"}" data-i="${idx[0]}" title="Click to rename speaker">${esc(first.speaker || "+ Speaker")}</span>
        <span class="ts" data-t="${first.start}">${fmt(first.start)}</span>
      </div>
      <div class="ptext">${idx.map(i => `<span class="seg" contenteditable="true" spellcheck="false" data-i="${i}">${highlightText(segs[i].text, q)}</span>`).join(" ")}</div>
    </div>`;
  }).join("") : `<div class="empty">No speech was detected in this file.</div>`;

  $("#wc").textContent = segs.reduce((n, s) => n + s.text.split(/\s+/).filter(Boolean).length, 0).toLocaleString();
  const media = $("#media");
  document.querySelectorAll(".ts").forEach(el => el.onclick = () => { media.currentTime = +el.dataset.t; media.play(); });
  document.querySelectorAll(".seg").forEach(el => {
    el.onclick = () => { media.currentTime = segs[+el.dataset.i].start + 0.01; };
    el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } };
    el.onblur = () => {
      const txt = el.innerText.replace(/\s+/g, " ").trim();
      if (txt !== segs[+el.dataset.i].text) { segs[+el.dataset.i].text = txt; queueSave(); }
    };
  });
  document.querySelectorAll(".spk").forEach(el => el.onclick = () => renameSpeaker(+el.dataset.i));
}

function renameSpeaker(i) {
  const segs = T.segments, old = segs[i].speaker || "";
  const name = prompt(old ? `Rename "${old}" everywhere to:` : "Speaker name for this paragraph:", old || "Speaker 1");
  if (name === null) return;
  if (old) segs.forEach(s => { if (s.speaker === old) s.speaker = name.trim(); });
  else { const p = paragraphs(segs).find(p => p.includes(i)); p.forEach(j => segs[j].speaker = name.trim()); }
  renderDoc(); queueSave();
}

function replaceAll() {
  const q = $("#find").value, r = $("#repl").value;
  if (!q) return toast("Type something to find");
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  let n = 0;
  T.segments.forEach(s => { s.text = s.text.replace(re, () => (n++, r)); });
  toast(n ? `Replaced ${n} occurrence${n > 1 ? "s" : ""}` : "No matches");
  if (n) { $("#find").value = r; renderDoc(); queueSave(); }
}

let activeSeg = -1;
function highlight() {
  const t = $("#media").currentTime, segs = T.segments;
  let i = segs.findIndex(s => t >= s.start && t < s.end + 0.15);
  if (i === activeSeg) return;
  document.querySelector(".seg.active")?.classList.remove("active");
  activeSeg = i;
  if (i < 0) return;
  const el = document.querySelector(`.seg[data-i="${i}"]`);
  if (!el) return;
  el.classList.add("active");
  if ($("#follow").checked && document.activeElement !== el) {
    const r = el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > innerHeight - 40) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function renderSummary() {
  if (!T.summary) return;
  $("#sumcard").hidden = false;
  // tiny markdown -> html (headings, bullets, bold)
  const lines = esc(T.summary).split("\n"); let html = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${l.replace(/^\s*[-*•]\s+/, "")}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (/^#+\s/.test(l)) html += `<h3>${l.replace(/^#+\s/, "")}</h3>`; else if (l.trim()) html += `<p>${l}</p>`;
  }
  $("#summary").innerHTML = html + (inList ? "</ul>" : "");
}

async function runAI(btn) {
  const label = btn.textContent;
  document.querySelectorAll("[data-ai]").forEach(b => b.disabled = true);
  btn.textContent = "Working…";
  try {
    await flushSave();
    const m = await api(`/api/transcriptions/${T.id}/ai`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: btn.dataset.ai }) });
    T.segments = m.segments; T.summary = m.summary; renderDoc(); renderSummary();
    toast({ summary: "Summary ready", cleanup: "Transcript cleaned up", speakers: "Speakers labeled — click a name to rename" }[btn.dataset.ai]);
  } catch (e) { toast(e.message); }
  btn.textContent = label;
  document.querySelectorAll("[data-ai]").forEach(b => b.disabled = false);
}

function queueSave() { dirty = true; $("#saved").textContent = "Saving…"; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 800); }
async function flushSave() {
  clearTimeout(saveTimer); if (!dirty) return; dirty = false;
  try {
    await api("/api/transcriptions/" + T.id, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: T.title, segments: T.segments }) });
    $("#saved").textContent = "All changes saved";
  } catch (e) { dirty = true; $("#saved").textContent = "Not saved: " + e.message; }
}
window.addEventListener("beforeunload", e => { if (dirty) { flushSave(); e.preventDefault(); } });

// ---------------- boot ----------------
(async () => {
  try { CONFIG = await api("/api/config"); } catch {}
  if (CONFIG.ai_enabled) $("#ai-status").innerHTML = `<span class="dot on"></span>AI tools on`;
  route();
})();
</script>
</body>
</html>
